{% extends "base.html" %}
{% block title %}Sign in | Agrofields Planet{% endblock %}
{% block content %}
<section class="section form-wrap">
 <form method="post" class="form-card">
  <h1>Sign in</h1>
  {% csrf_token %}{{ form.as_p }}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <button class="button" type="submit">Sign in</button>
  <p><a href="{% url 'customer_password_reset' %}">Forgot your password?</a></p>
  <p>New here? <a href="{% url 'register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a>.</p>
 </form>
</section>
{% endblock %}
